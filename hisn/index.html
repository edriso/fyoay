    <script>
      // Apply the saved theme before the first paint, so there is no flash of
      // the wrong colours. On this site that flash is worse than cosmetic: a
      // white screen at three in the morning is the opposite of what somebody
      // opening this page needs. The React side reads it back from here
      // (src/hooks/useTheme.ts).
      ;(function () {
        try {
          var saved = localStorage.getItem('fyoay-theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var isDark = saved ? saved === 'dark' : prefersDark
          document.documentElement.classList.toggle('dark', isDark)
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', isDark ? '#0a1417' : '#f8fafc')
        } catch (e) {
          /* private browsing: fall back to the light theme */
        }
      })()
    </script>

    <!--
      The boot placeholder, styled here rather than in src/index.css so it needs
      nothing but the HTML itself. React's createRoot clears #root on mount, so
      this is only ever on screen while the JavaScript is still arriving.

      It fades in after 400ms. On a normal connection the app is up before that
      and nobody sees it; a placeholder that flashes for 80ms is worse than
      none. On a slow one it replaces a blank page, and this is a site where a
      blank page for two seconds is two seconds somebody spends alone with the
      thing they opened it to escape.
    -->
    <style>
      .boot {

      @media (prefers-reduced-motion: reduce) {
        .boot {
          animation: none;
          opacity: 1;
        }
        .boot-ring {
          display: none;
        }
      }
    </style>
